<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เว็บแรกของฉัน</title>

  <style>
    /* ตรงนี้คือส่วน CSS ทั้งหมด */

    body {
      font-family: "Segoe UI", "Sarabun", sans-serif;
      background-color: #f4f1ea;
      color: #333333;
      max-width: 700px;
      margin: 0 auto;
      padding: 60px 24px;
      line-height: 1.8;
    }

    h1 {
      color: #2c5f4f;
      font-size: 36px;
      border-bottom: 3px solid #2c5f4f;
      padding-bottom: 12px;
      margin-bottom: 24px;
    }

    p {
      font-size: 17px;
      margin-bottom: 16px;
    }

    .highlight {
      background-color: #ffffff;
      border-left: 4px solid #c08a3e;
      padding: 20px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <h1>สวัสดี นี่คือเว็บแรกของฉัน</h1>

  <p>ถ้าคุณอ่านข้อความนี้จากอินเทอร์เน็ตได้ แปลว่าสำเร็จแล้ว</p>

  <p class="highlight">
    ย่อหน้านี้ถูกใส่ class ชื่อ highlight ไว้ จึงหน้าตาไม่เหมือนย่อหน้าอื่น
  </p>

</body>
</html>
